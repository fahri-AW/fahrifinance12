version: '3.8'

services:
  financeflow-app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@financeflow-db:5432/financeflow
      - JWT_SECRET=financeflow_super_secret_jwt_key_2026
    depends_on:
      - financeflow-db
    restart: unless-stopped

  financeflow-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=financeflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
